name: Deploy Firebase Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Build
        run: npm run build
        working-directory: functions

      - name: Write service account key
        # Pass via env so GitHub Actions masks the value in logs.
        # Future: migrate to Workload Identity Federation to eliminate the long-lived key entirely.
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA_KEY" > /tmp/gcp-sa-key.json

      - name: Deploy to Firebase
        run: npx firebase-tools@15.22.0 deploy --only functions
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/gcp-sa-key.json
