name: Deploy Firebase Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Build
        run: npm run build
        working-directory: functions

      # Workload Identity Federation: exchanges the job's OIDC token for short-lived
      # Google credentials. The provider only accepts this repo's main branch.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1062750797267/locations/global/workloadIdentityPools/github/providers/scrum-poker-cleanup
          service_account: scrum-poker-cleanup-deploy@thescrumpoker.iam.gserviceaccount.com

      - name: Deploy to Firebase
        run: npx firebase-tools@15.22.0 deploy --only functions --force
        working-directory: functions
